<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="{{ course_name }} Queue" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    {% include "icons.html" %}

    {# the app's stylesheet, with Bootstrap's, and its script (oh_queue/vite.py) #}
    {{ vite_tags() }}

    <title>{{ course_name }} Queue</title>

    <script>
      window.courseName = {{ course_name|tojson }};
      // The course's pages and API are under this path: /offerings/<canvas course id>.
      window.basePath = {{ base_path|tojson }};
    </script>
  </head>
  <body>
    {% block header %}{% endblock %} {% block body %}{% endblock %}
  </body>
</html>
