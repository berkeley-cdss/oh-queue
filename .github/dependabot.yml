# Keeps the SHA-pinned actions in .github/workflows, the pinned Python packages
# in requirements.txt and requirements-dev.txt, and the npm packages up to date
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # skip releases newer than this, so a malicious one is more likely to be caught first
    cooldown:
      default-days: 7
  # reads every requirements .txt file in the directory, so both requirements files
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # only delays these weekly version bumps, not Dependabot security updates
    cooldown:
      default-days: 7
  # the frontend's packages, in package.json and yarn.lock
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
