name: E2E

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
      # the course pages need the React build, as in the Dockerfile
      - name: Build the frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
      # the tests sign in through the development login and use Chrome, which the runner has
      - name: Run end to end tests
        run: pytest tests/e2e
      - name: Keep screenshots of failed tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7
