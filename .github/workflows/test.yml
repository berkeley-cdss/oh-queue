name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Run tests with pytest
        run: |
          # make sure the pipe passes on pytest's exit code, so failures fail CI
          set -o pipefail
          # fail if coverage drops below its level when this minimum was set (50.5%),
          # and write coverage.xml for Codecov
          pytest --cov=oh_queue --cov-report=term-missing:skip-covered --cov-report=xml \
            --cov-fail-under=50 | tee pytest-coverage.txt
      # the per-file coverage report, on the run's summary page
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Server test coverage"
            echo '```'
            cat pytest-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Codecov compares coverage with main's and fails a PR that lowers it (codecov.yml)
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # upload only coverage.xml, not pytest-coverage.txt too
          disable_search: true
          # Codecov's file fixes read every file in the checkout and stop at
          # node_modules; coverage only covers oh_queue/, so they aren't needed.
          disable_file_fixes: true
