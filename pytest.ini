[pytest]
# `pytest` runs the server tests. The end to end tests and the a11y audit need Chrome
# and the frontend build (`yarn build`), so they run on their own: `pytest tests/e2e`
# and `pytest tests/a11y` (docs/a11y.md).
testpaths = tests
# pytest's defaults, which this replaces, and the browser tests
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} e2e a11y
# oh_queue/ and config.py are imported from the repository root.
pythonpath = .
