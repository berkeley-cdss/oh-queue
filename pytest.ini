[pytest]
# `pytest` runs the server tests. The end to end tests need Chrome and the frontend
# build (`yarn build`), so they run on their own: `pytest tests/e2e`.
testpaths = tests
# pytest's defaults, which this replaces, and the end to end tests
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} e2e
# oh_queue/ and config.py are imported from the repository root.
pythonpath = .
